services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet_scan}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scanner_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scanner:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scanner_net
    ports:
      - "${SCANNER_BIND_HOST:-127.0.0.1}:${SCANNER_BIND_PORT:-8080}:8080"

volumes:
  postgres_data:

networks:
  scanner_net:
    driver: bridge
